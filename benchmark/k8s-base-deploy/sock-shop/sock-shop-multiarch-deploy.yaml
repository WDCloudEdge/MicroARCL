---
apiVersion: v1
kind: Namespace
metadata:
  name: sock-shop

---
# ============================================================
# session-db (Redis)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-db
  namespace: sock-shop
  labels:
    name: session-db
spec:
  replicas: 1
  selector:
    matchLabels:
      name: session-db
  template:
    metadata:
      labels:
        name: session-db
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: session-db
          image: 47.121.177.73:81/sock-shop-multiarch/session-db:latest
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
      nodeSelector:
        beta.kubernetes.io/os: linux

---
apiVersion: v1
kind: Service
metadata:
  name: session-db
  namespace: sock-shop
  labels:
    name: session-db
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    name: session-db

---
# ============================================================
# catalogue-db
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-db
  namespace: sock-shop
  labels:
    name: catalogue-db
spec:
  replicas: 1
  selector:
    matchLabels:
      name: catalogue-db
  template:
    metadata:
      labels:
        name: catalogue-db
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: catalogue-db
          image: 47.121.177.73:81/sock-shop-multiarch/catalogue-db:latest
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      nodeSelector:
        beta.kubernetes.io/os: linux

---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-db
  namespace: sock-shop
  labels:
    name: catalogue-db
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    name: catalogue-db

---
# ============================================================
# catalogue (Go)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: sock-shop
  labels:
    name: catalogue
spec:
  replicas: 1
  selector:
    matchLabels:
      name: catalogue
  template:
    metadata:
      labels:
        name: catalogue
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: catalogue
          image: 47.121.177.73:81/sock-shop-multiarch/catalogue:latest
          command: ["/app"]
          args:
            - -port=8080
          env:
            - name: DB
              value: catalogue-db
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            capabilities:
              drop:
                - all
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
      nodeSelector:
        beta.kubernetes.io/os: linux

---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: sock-shop
  labels:
    name: catalogue
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    name: catalogue

