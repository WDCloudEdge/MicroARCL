# ============================================================
# front-end (Node.js)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end
  namespace: sock-shop
  labels:
    name: front-end
spec:
  replicas: 1
  selector:
    matchLabels:
      name: front-end
  template:
    metadata:
      labels:
        name: front-end
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: front-end
          image: 47.121.177.73:81/sock-shop-multiarch/front-end:latest
          env:
            - name: SESSION_REDIS
              value: "true"
          ports:
            - containerPort: 8079
          livenessProbe:
            httpGet:
              path: /
              port: 8079
            initialDelaySeconds: 300
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8079
            initialDelaySeconds: 30
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            capabilities:
              drop:
                - all
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
      nodeSelector:
        beta.kubernetes.io/os: linux

---
apiVersion: v1
kind: Service
metadata:
  name: front-end
  namespace: sock-shop
  labels:
    name: front-end
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8079
      nodePort: 30001
  selector:
    name: front-end
