# ============================================================
# carts (Java)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
  namespace: sock-shop
  labels:
    name: carts
spec:
  replicas: 1
  selector:
    matchLabels:
      name: carts
  template:
    metadata:
      labels:
        name: carts
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: carts
          image: 47.121.177.73:81/sock-shop-multiarch/carts:latest
          env:
            - name: JAVA_OPTS
              value: >-
                -Xms64m -Xmx128m
                -XX:+UseG1GC
                -Djava.security.egd=file:/dev/urandom
                -Dspring.zipkin.enabled=false
                -Dspring.autoconfigure.exclude=io.prometheus.client.spring.boot.PrometheusAutoConfiguration,io.prometheus.client.spring.boot.PrometheusEndpointAutoConfiguration
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 900
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 600
            periodSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: false
      nodeSelector:
        beta.kubernetes.io/os: linux

---
apiVersion: v1
kind: Service
metadata:
  name: carts
  namespace: sock-shop
  labels:
    name: carts
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    name: carts

